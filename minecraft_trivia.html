<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Trivia!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #87CEEB;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 63px, rgba(255,255,255,0.05) 63px, rgba(255,255,255,0.05) 64px),
        repeating-linear-gradient(90deg, transparent, transparent 63px, rgba(255,255,255,0.05) 63px, rgba(255,255,255,0.05) 64px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 68px;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(to bottom, #5D9E2E 0%, #5D9E2E 16px, #8B5E3C 16px, #8B5E3C 100%);
      z-index: 0;
    }

    .title-block {
      background: #5D9E2E;
      border: 4px solid #3B6E1A;
      box-shadow: inset -4px -4px 0 #3B6E1A, inset 4px 4px 0 #7FCC2E;
      color: #fff;
      text-shadow: 3px 3px 0 #3B6E1A;
      font-size: 22px;
      padding: 18px 32px;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #fff;
      text-shadow: 2px 2px 0 #2255aa;
      font-size: 9px;
      margin-bottom: 24px;
      text-align: center;
    }

    .card {
      background: #C6C6C6;
      border: 4px solid #555;
      box-shadow: inset -4px -4px 0 #555, inset 4px 4px 0 #fff;
      width: 100%;
      max-width: 680px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .pixel-face {
      display: inline-grid;
      gap: 0;
      image-rendering: pixelated;
    }

    .pixel-face span { display: block; }

    /* ===== START SCREEN ===== */
    #start-screen { text-align: center; }

    .start-face-wrap { margin: 10px auto 18px; }

    .play-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      background: #5D9E2E;
      border: 4px solid #3B6E1A;
      box-shadow: inset -4px -4px 0 #3B6E1A, inset 4px 4px 0 #7FCC2E;
      color: #fff;
      text-shadow: 2px 2px 0 #3B6E1A;
      padding: 18px 40px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 24px;
      transition: background 0.1s;
    }

    .play-btn:hover { background: #6EBF38; }

    .scoreboard {
      border: 3px solid #555;
      background: #A0A0A0;
      box-shadow: inset -3px -3px 0 #555, inset 3px 3px 0 #ccc;
    }

    .scoreboard-title {
      background: #C49A3C;
      border-bottom: 3px solid #7A5C1A;
      color: #fff;
      text-shadow: 2px 2px 0 #7A5C1A;
      font-size: 10px;
      padding: 10px;
      text-align: center;
    }

    .scoreboard-body { padding: 8px; }

    .scoreboard-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 7px;
      border-bottom: 2px solid #888;
    }

    .scoreboard-entry:last-child { border-bottom: none; }

    .scoreboard-rank {
      color: #C49A3C;
      text-shadow: 1px 1px 0 #7A5C1A;
      font-size: 10px;
      min-width: 28px;
      text-align: center;
    }

    .scoreboard-name {
      flex: 1;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scoreboard-score {
      color: #222;
      min-width: 48px;
      text-align: right;
    }

    .diff-badge {
      font-size: 6px;
      padding: 2px 6px;
      border: 2px solid;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    .diff-badge.easy { background: #5D9E2E; border-color: #3B6E1A; }
    .diff-badge.medium { background: #C49A3C; border-color: #7A5C1A; }
    .diff-badge.hard { background: #C0392B; border-color: #7B241C; }
    .diff-badge.impossible { background: #4A0A4A; border-color: #2A002A; }

    .scoreboard-empty {
      padding: 16px;
      font-size: 7px;
      color: #666;
      text-align: center;
      line-height: 1.8;
    }

    /* ===== SETUP SCREEN ===== */
    .section-title {
      font-size: 10px;
      color: #333;
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 1px 1px 0 #ddd;
    }

    .name-input {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      width: 100%;
      padding: 12px 16px;
      background: #2C2C2C;
      border: 3px solid #555;
      box-shadow: inset 2px 2px 0 #111;
      color: #5D9E2E;
      text-shadow: 1px 1px 0 #000;
      margin-bottom: 24px;
      outline: none;
    }

    .name-input::placeholder { color: #666; }
    .name-input:focus { border-color: #5D9E2E; }

    .avatar-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .avatar-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 3px solid #888;
      background: #B0B0B0;
      cursor: pointer;
      transition: all 0.1s;
    }

    .avatar-option:hover {
      border-color: #C49A3C;
      background: #C0C0C0;
    }

    .avatar-option.selected {
      border-color: #C49A3C;
      background: #D4C4A0;
      box-shadow: inset -3px -3px 0 #7A5C1A, inset 3px 3px 0 #FFDD70;
    }

    .avatar-name { font-size: 6px; color: #444; }

    .continue-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: #C49A3C;
      border: 4px solid #7A5C1A;
      box-shadow: inset -4px -4px 0 #7A5C1A, inset 4px 4px 0 #FFDD70;
      color: #fff;
      text-shadow: 2px 2px 0 #7A5C1A;
      padding: 14px 28px;
      cursor: pointer;
      width: 100%;
    }

    .continue-btn:hover { background: #D4A842; }

    .continue-btn:disabled {
      background: #888;
      border-color: #555;
      box-shadow: inset -4px -4px 0 #555, inset 4px 4px 0 #aaa;
      color: #aaa;
      text-shadow: none;
      cursor: default;
    }

    /* ===== DIFFICULTY SCREEN ===== */
    .diff-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .diff-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 20px;
      border: 4px solid;
      cursor: pointer;
      color: #fff;
      text-align: left;
      transition: filter 0.1s;
    }

    .diff-btn:hover { filter: brightness(1.15); }

    .diff-btn .diff-label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .diff-btn .diff-desc {
      font-size: 7px;
      opacity: 0.85;
    }

    .diff-btn.easy-btn {
      background: #5D9E2E;
      border-color: #3B6E1A;
      box-shadow: inset -4px -4px 0 #3B6E1A, inset 4px 4px 0 #7FCC2E;
      text-shadow: 2px 2px 0 #3B6E1A;
    }

    .diff-btn.medium-btn {
      background: #C49A3C;
      border-color: #7A5C1A;
      box-shadow: inset -4px -4px 0 #7A5C1A, inset 4px 4px 0 #FFDD70;
      text-shadow: 2px 2px 0 #7A5C1A;
    }

    .diff-btn.hard-btn {
      background: #C0392B;
      border-color: #7B241C;
      box-shadow: inset -4px -4px 0 #7B241C, inset 4px 4px 0 #E57568;
      text-shadow: 2px 2px 0 #7B241C;
    }

    .diff-btn.impossible-btn {
      background: #4A0A4A;
      border-color: #2A002A;
      box-shadow: inset -4px -4px 0 #2A002A, inset 4px 4px 0 #8B2A8B;
      text-shadow: 2px 2px 0 #2A002A;
    }

    /* ===== PLAYER INFO BAR ===== */
    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #A0A0A0;
      border: 3px solid #555;
      box-shadow: inset -2px -2px 0 #555, inset 2px 2px 0 #ccc;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .player-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-bar-name { font-size: 8px; color: #333; }

    /* ===== QUIZ SCREEN ===== */
    .progress-bar-wrap {
      background: #888;
      border: 3px solid #555;
      height: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .progress-bar-fill {
      background: linear-gradient(to bottom, #7FCC2E 0%, #5D9E2E 100%);
      height: 100%;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 7px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .question-num {
      font-size: 8px;
      color: #444;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 12px;
      color: #222;
      line-height: 1.8;
      margin-bottom: 24px;
      background: #D4D4D4;
      border: 3px solid #888;
      box-shadow: inset 2px 2px 0 #bbb;
      padding: 16px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: #8B8B8B;
      border: 3px solid #555;
      box-shadow: inset -3px -3px 0 #555, inset 3px 3px 0 #bbb;
      color: #222;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: background 0.1s;
      line-height: 1.5;
    }

    .option-btn:hover:not(:disabled) {
      background: #7A9EC5;
      box-shadow: inset -3px -3px 0 #3a6a9a, inset 3px 3px 0 #aaccee;
    }

    .option-btn.correct {
      background: #5D9E2E;
      color: #fff;
      box-shadow: inset -3px -3px 0 #3B6E1A, inset 3px 3px 0 #9FE83E;
    }

    .option-btn.wrong {
      background: #C0392B;
      color: #fff;
      box-shadow: inset -3px -3px 0 #7B241C, inset 3px 3px 0 #E57568;
    }

    .option-btn:disabled { cursor: default; }

    .feedback {
      margin-top: 18px;
      font-size: 9px;
      padding: 12px;
      border: 3px solid #555;
      line-height: 1.8;
      display: none;
    }

    .feedback.correct {
      background: #d4edbc;
      border-color: #3B6E1A;
      color: #2a5a10;
    }

    .feedback.wrong {
      background: #f8d7d4;
      border-color: #7B241C;
      color: #7B241C;
    }

    .next-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: #C49A3C;
      border: 4px solid #7A5C1A;
      box-shadow: inset -4px -4px 0 #7A5C1A, inset 4px 4px 0 #FFDD70;
      color: #fff;
      text-shadow: 2px 2px 0 #7A5C1A;
      padding: 14px 28px;
      cursor: pointer;
      margin-top: 18px;
      display: none;
      width: 100%;
    }

    .next-btn:hover { background: #D4A842; }

    /* ===== TIMER BAR ===== */
    .timer-bar-wrap {
      background: #555;
      border: 3px solid #333;
      height: 14px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(to bottom, #7FCC2E 0%, #5D9E2E 100%);
      transition: width 0.25s linear, background 0.3s;
    }

    .timer-bar-fill.warning {
      background: linear-gradient(to bottom, #FFDD70 0%, #C49A3C 100%);
    }

    .timer-bar-fill.danger {
      background: linear-gradient(to bottom, #E57568 0%, #C0392B 100%);
      animation: pulse-danger 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-danger {
      from { opacity: 1; }
      to { opacity: 0.7; }
    }

    .timer-label {
      font-size: 7px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    /* ===== SCREEN TRANSITIONS ===== */
    .screen {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .screen.fade-out {
      opacity: 0;
      transform: translateY(-12px);
    }

    /* Question slide animation */
    .question-enter {
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Correct answer particles */
    .particle-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      image-rendering: pixelated;
      animation: particleFly 0.7s ease-out forwards;
    }

    @keyframes particleFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0.3); }
    }

    /* Option button feedback animation */
    .option-btn.correct {
      animation: correctPop 0.3s ease;
    }

    .option-btn.wrong {
      animation: wrongShake 0.4s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Score reveal animation */
    .score-big.reveal {
      animation: scoreReveal 0.6s ease forwards;
    }

    @keyframes scoreReveal {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ===== RESULTS SCREEN ===== */
    #results-screen { text-align: center; }

    .results-face-wrap { margin: 10px auto 18px; }

    .score-block {
      background: #5D9E2E;
      border: 4px solid #3B6E1A;
      box-shadow: inset -4px -4px 0 #3B6E1A, inset 4px 4px 0 #7FCC2E;
      color: #fff;
      text-shadow: 2px 2px 0 #3B6E1A;
      font-size: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .score-big {
      font-size: 40px;
      display: block;
      margin: 10px 0;
      text-shadow: 4px 4px 0 #3B6E1A;
    }

    .rank-text {
      font-size: 10px;
      color: #ffee88;
      text-shadow: 2px 2px 0 #7A5C1A;
      margin: 8px 0 0;
    }

    .review-list {
      text-align: left;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-item {
      font-size: 8px;
      padding: 10px 12px;
      border: 2px solid #888;
      line-height: 1.7;
    }

    .review-item.r-correct { background: #d4edbc; border-color: #3B6E1A; }
    .review-item.r-wrong   { background: #f8d7d4; border-color: #7B241C; }

    .results-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .restart-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: #5D9E2E;
      border: 4px solid #3B6E1A;
      box-shadow: inset -4px -4px 0 #3B6E1A, inset 4px 4px 0 #7FCC2E;
      color: #fff;
      text-shadow: 2px 2px 0 #3B6E1A;
      padding: 16px 32px;
      cursor: pointer;
      width: 100%;
    }

    .restart-btn:hover { background: #6EBF38; }

    .menu-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      background: #8B8B8B;
      border: 3px solid #555;
      box-shadow: inset -3px -3px 0 #555, inset 3px 3px 0 #bbb;
      color: #222;
      padding: 12px 24px;
      cursor: pointer;
      width: 100%;
    }

    .menu-btn:hover { background: #999; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      .title-block { font-size: 14px; padding: 14px 16px; }
      .question-text { font-size: 10px; }
      .option-btn { font-size: 8px; }
      .avatar-option { padding: 8px; }
      .diff-btn .diff-label { font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="title-block">⛏ MINECRAFT TRIVIA ⛏</div>
  <p class="subtitle">Test your Minecraft knowledge!</p>

  <!-- Start Screen -->
  <div class="card screen active" id="start-screen">
    <div class="start-face-wrap">
      <div class="pixel-face" id="start-face"></div>
    </div>
    <button class="play-btn" onclick="sfxClick(); showSetup()">▶ PLAY</button>
    <div class="scoreboard">
      <div class="scoreboard-title">⛏ TOP MINERS ⛏</div>
      <div class="scoreboard-body" id="scoreboard-list"></div>
    </div>
  </div>

  <!-- Setup Screen -->
  <div class="card screen" id="setup-screen">
    <div class="section-title">ENTER YOUR NAME</div>
    <input type="text" class="name-input" id="player-name" placeholder="Type your name..." maxlength="12" oninput="checkSetupReady()">
    <div class="section-title">CHOOSE YOUR AVATAR</div>
    <div class="avatar-grid" id="avatar-grid"></div>
    <button class="continue-btn" id="continue-btn" onclick="sfxClick(); showDifficulty()" disabled>CONTINUE ▶</button>
  </div>

  <!-- Difficulty Screen -->
  <div class="card screen" id="difficulty-screen">
    <div class="player-bar">
      <div class="player-bar-left">
        <div class="pixel-face" id="diff-avatar"></div>
        <span class="player-bar-name" id="diff-player-name"></span>
      </div>
    </div>
    <div class="section-title" style="margin-top:16px">SELECT DIFFICULTY</div>
    <div class="diff-grid">
      <button class="diff-btn easy-btn" onclick="sfxClick(); startQuiz('easy')">
        <span class="diff-label">⛏ EASY</span>
        <span class="diff-desc">For beginners — basic Minecraft knowledge (15s per question)</span>
      </button>
      <button class="diff-btn medium-btn" onclick="sfxClick(); startQuiz('medium')">
        <span class="diff-label">⚔ MEDIUM</span>
        <span class="diff-desc">For experienced players — game mechanics (12s per question)</span>
      </button>
      <button class="diff-btn hard-btn" onclick="sfxClick(); startQuiz('hard')">
        <span class="diff-label">☠ HARD</span>
        <span class="diff-desc">For experts — advanced &amp; technical (9s per question)</span>
      </button>
      <button class="diff-btn impossible-btn" onclick="sfxClick(); startQuiz('impossible')">
        <span class="diff-label">💀 IMPOSSIBLE</span>
        <span class="diff-desc">For true legends — obscure, version-specific &amp; absurd (8s per question)</span>
      </button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div class="card screen" id="quiz-screen">
    <div class="player-bar">
      <div class="player-bar-left">
        <div class="pixel-face" id="quiz-avatar"></div>
        <span class="player-bar-name" id="quiz-player-name"></span>
      </div>
      <span class="diff-badge" id="quiz-diff-badge"></span>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar-fill" id="timer-fill"></div>
      <span class="timer-label" id="timer-label">15s</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      <span class="progress-label" id="progress-label">Question 1 of 10</span>
    </div>
    <div class="question-num" id="q-num"></div>
    <div class="question-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div class="feedback" id="q-feedback"></div>
    <button class="next-btn" id="next-btn" onclick="sfxClick(); nextQuestion()">NEXT ▶</button>
  </div>

  <!-- Results Screen -->
  <div class="card screen" id="results-screen">
    <div class="results-face-wrap">
      <div class="pixel-face" id="results-face"></div>
    </div>
    <div class="score-block">
      <div>YOUR SCORE</div>
      <span class="score-big" id="final-score"></span>
      <div class="rank-text" id="rank-text"></div>
    </div>
    <div class="review-list" id="review-list"></div>
    <div class="results-buttons">
      <button class="restart-btn" onclick="sfxClick(); showDifficulty()">▶ PLAY AGAIN</button>
      <button class="menu-btn" onclick="sfxClick(); showStart()">⬅ MAIN MENU</button>
    </div>
  </div>

  <script>
    /* ===== AVATARS ===== */
    const AVATARS = [
      {
        name: 'Steve',
        pixels: (() => {
          const H='#6B4226', S='#C8956C', E='#3F3F3F', M='#694B37';
          return [
            H,H,H,H,H,H,H,H,

    /* ===== SOUND ENGINE ===== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playTone(freq, duration, type, vol) {
      ensureAudio();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + duration);
    }

    function sfxCorrect() {
      playTone(523, 0.1, 'square'); setTimeout(() => playTone(659, 0.1, 'square'), 80);
      setTimeout(() => playTone(784, 0.2, 'square'), 160);
    }

    function sfxWrong() {
      playTone(200, 0.15, 'sawtooth', 0.06); setTimeout(() => playTone(150, 0.25, 'sawtooth', 0.06), 120);
    }

    function sfxClick() { playTone(800, 0.04, 'square', 0.04); }

    function sfxTick() { playTone(1000, 0.02, 'square', 0.03); }

    function sfxTimeUp() {
      playTone(400, 0.15, 'sawtooth', 0.07); setTimeout(() => playTone(300, 0.15, 'sawtooth', 0.07), 100);
      setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.07), 200);
    }

    function sfxVictory() {
      const notes = [523, 587, 659, 784, 880, 1047];
      notes.forEach((n, i) => setTimeout(() => playTone(n, 0.15, 'square', 0.06), i * 100));

    /* ===== TIMER ===== */
    const TIMER_DURATIONS = { easy: 15, medium: 12, hard: 9, impossible: 8 };
    let timerInterval = null;
    let timeLeft = 0;
    let timerTotal = 0;

    function startTimer() {
      timerTotal = TIMER_DURATIONS[difficulty];
      timeLeft = timerTotal;
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        timeLeft -= 0.25;
        if (timeLeft <= 3 && timeLeft > 0 && Math.abs(timeLeft - Math.round(timeLeft)) < 0.13) sfxTick();
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timeUp();
        }
      }, 250);
    }

    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

    function updateTimerDisplay() {
      const pct = Math.max(0, (timeLeft / timerTotal) * 100);
      const fill = document.getElementById('timer-fill');
      const label = document.getElementById('timer-label');
      fill.style.width = pct + '%';
      label.textContent = Math.ceil(Math.max(0, timeLeft)) + 's';
      fill.classList.remove('warning', 'danger');
      if (pct <= 25) fill.classList.add('danger');
      else if (pct <= 50) fill.classList.add('warning');
    }

    /* ===== PARTICLES ===== */
    function spawnParticles(btn) {
      const rect = btn.getBoundingClientRect();
      const card = btn.closest('.card');
      const cardRect = card.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - cardRect.left;
      const cy = rect.top + rect.height / 2 - cardRect.top;

      let container = card.querySelector('.particle-container');
      if (!container) { container = document.createElement('div'); container.className = 'particle-container'; card.style.position = 'relative'; card.appendChild(container); }

      const colors = ['#5D9E2E','#7FCC2E','#FFDD70','#C49A3C','#fff'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 60;
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        container.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    /* ===== SCREEN TRANSITIONS ===== */
    function showScreen(id) {
      const current = document.querySelector('.screen.active');
      const next = document.getElementById(id);
      if (current && current !== next) {
        current.classList.add('fade-out');
        setTimeout(function() {
          current.classList.remove('active', 'fade-out');
          next.classList.add('active');
        }, 200);
      } else {
        if (current) current.classList.remove('active');
        next.classList.add('active');
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderFace(container, avatarIndex, size) {
      size = size || 10;
      container.innerHTML = '';
      container.style.gridTemplateColumns = 'repeat(8, ' + size + 'px)';
      container.style.gridTemplateRows = 'repeat(8, ' + size + 'px)';
      AVATARS[avatarIndex].pixels.forEach(function(color) {
        const s = document.createElement('span');
        s.style.background = color;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        container.appendChild(s);

    /* ===== STORAGE ===== */
    function loadScores() {
      try {
        return JSON.parse(localStorage.getItem('minecraft_trivia_scores') || '[]');
      } catch (e) { return []; }
    }

    function saveScore(name, avatar, sc, total, diff) {
      const scores = loadScores();
      scores.push({ name: name, avatar: avatar, score: sc, total: total, difficulty: diff, timestamp: Date.now() });
      const diffOrder = { impossible: 4, hard: 3, medium: 2, easy: 1 };
      scores.sort(function(a, b) {
        if (b.score !== a.score) return b.score - a.score;
        if (diffOrder[b.difficulty] !== diffOrder[a.difficulty]) return diffOrder[b.difficulty] - diffOrder[a.difficulty];
        return a.timestamp - b.timestamp;
      });
      localStorage.setItem('minecraft_trivia_scores', JSON.stringify(scores.slice(0, 10)));
    }

    /* ===== QUIZ LOGIC ===== */
    function loadQuestion() {
      answered = false;
      const q = currentQuestions[current];
      const total = currentQuestions.length;

      const qNum = document.getElementById('q-num');
      const qText = document.getElementById('q-text');
      const opts = document.getElementById('q-options');

      qNum.textContent = 'Question ' + (current + 1) + ' / ' + total;
      qText.textContent = q.q;

      const pct = (current / total) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-label').textContent = 'Question ' + (current + 1) + ' of ' + total;

      opts.innerHTML = '';
      var letters = ['A', 'B', 'C', 'D'];
      q.options.forEach(function(opt, i) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = letters[i] + ')  ' + opt;
        btn.onclick = function() { sfxClick(); selectAnswer(i); };
        opts.appendChild(btn);
      });

      document.getElementById('q-feedback').style.display = 'none';
      document.getElementById('q-feedback').className = 'feedback';
      document.getElementById('next-btn').style.display = 'none';

      qText.classList.remove('question-enter');
      opts.classList.remove('question-enter');
      void qText.offsetWidth;
      qText.classList.add('question-enter');
      opts.classList.add('question-enter');

      startTimer();
    }

    function selectAnswer(chosen) {
      if (answered) return;
      answered = true;
      stopTimer();
      const q = currentQuestions[current];
      const buttons = document.querySelectorAll('#q-options .option-btn');
      const fb = document.getElementById('q-feedback');

      userAnswers.push(chosen);

      buttons.forEach(function(btn, i) {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        else if (i === chosen && i !== q.answer) btn.classList.add('wrong');
      });

      if (chosen === q.answer) {
        score++;
        sfxCorrect();
        spawnParticles(buttons[chosen]);
        fb.className = 'feedback correct';
        fb.textContent = '\u2714  Correct! ' + q.explain;
      } else {
        sfxWrong();
        fb.className = 'feedback wrong';
        fb.textContent = '\u2718  Not quite! ' + q.explain;
      }
      fb.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
      document.getElementById('next-btn').textContent =
        current === currentQuestions.length - 1 ? 'SEE RESULTS \u25B6' : 'NEXT \u25B6';
    }

    function nextQuestion() {
      current++;
      if (current >= currentQuestions.length) {
        showResults();
      } else {
        loadQuestion();
      }
    }

    function showResults() {
      stopTimer();
      saveScore(playerName, playerAvatar, score, currentQuestions.length, difficulty);

      renderFace(document.getElementById('results-face'), playerAvatar, 10);
      const scoreBig = document.getElementById('final-score');
      scoreBig.textContent = score + ' / ' + currentQuestions.length;
      scoreBig.classList.remove('reveal');
      void scoreBig.offsetWidth;
      scoreBig.classList.add('reveal');

      if (score >= 6) sfxVictory();

      const ranks = [
        [10, 'MASTER MINER! You know everything!'],
        [8,  'DIAMOND LEVEL! Almost perfect!'],
        [6,  'IRON LEVEL! Pretty good!'],
        [4,  'STONE LEVEL! Keep practising!'],
        [0,  'DIRT LEVEL! Time to play more Minecraft!']
      ];
      var rankLabel = ranks[ranks.length - 1][1];
      for (var r = 0; r < ranks.length; r++) {
        if (score >= ranks[r][0]) { rankLabel = ranks[r][1]; break; }
      }
      document.getElementById('rank-text').textContent = rankLabel;

      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';
      currentQuestions.forEach(function(q, i) {
        const correct = userAnswers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'review-item ' + (correct ? 'r-correct' : 'r-wrong');
        const qText = q.q.length > 58 ? q.q.slice(0, 55) + '...' : q.q;
        div.innerHTML = (correct ? '\u2714' : '\u2718') + ' Q' + (i + 1) + ': ' + qText +
          '<br>Your answer: <b>' + q.options[userAnswers[i]] + '</b>';
        reviewList.appendChild(div);
      });

      showScreen('results-screen');
    }

    /* ===== SCOREBOARD ===== */
    function renderScoreboard() {
      const scores = loadScores();
      const list = document.getElementById('scoreboard-list');
      if (scores.length === 0) {
        list.innerHTML = '<div class="scoreboard-empty">No scores yet!<br>Be the first to play!</div>';
        return;
      }
      list.innerHTML = '';
      scores.slice(0, 10).forEach(function(entry, i) {
        const row = document.createElement('div');
        row.className = 'scoreboard-entry';

        const rank = document.createElement('span');
        rank.className = 'scoreboard-rank';
        rank.textContent = '#' + (i + 1);

        const face = document.createElement('div');
        face.className = 'pixel-face';
        if (entry.avatar >= 0 && entry.avatar < AVATARS.length) {
          renderFace(face, entry.avatar, 5);
        }

        const name = document.createElement('span');
        name.className = 'scoreboard-name';
        name.textContent = entry.name;

        const sc = document.createElement('span');
        sc.className = 'scoreboard-score';
        sc.textContent = entry.score + '/' + entry.total;

        const badge = document.createElement('span');
        badge.className = 'diff-badge ' + entry.difficulty;
        badge.textContent = entry.difficulty.toUpperCase();

        row.appendChild(rank);
        row.appendChild(face);
        row.appendChild(name);
        row.appendChild(sc);
        row.appendChild(badge);
        list.appendChild(row);
      });
    }

    /* ===== INIT ===== */
    showStart();
  </script>
</body>
</html>
